#logging.level.org.apache.hc.client5.http.wire=INFO
#logging.level.org.apache.hc.client5.http=DEBUG
springdoc.swagger-ui.path=/

# Actuator: expose only essential endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

# Typed GitHub API configuration properties
# Prefer environment variables: GITHUB_API_URL, GITHUB_API_TOKEN
# Defaults provided for local development
github.api.url=${GITHUB_API_URL:https://api.github.com}
github.api.token=${GITHUB_API_TOKEN:}